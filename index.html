<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Dashboard</title>
<link rel="manifest" href="practice-manifest.json">
<meta name="theme-color" content="#0A0705">
<link rel="apple-touch-icon" href="practice-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #0A0705; --paper-dark: #14100A; --paper-darker: #1D160D;
    --ink: #FFA940; --ink-muted: #9C9484; --line: #4A3620; --ink-black: #050302;
    --stamp-red: #FF5E3A; --field-green: #6FCF52; --brass: #FFA940;
    --sec-fund: #FFA940; --sec-net: #FFA940; --sec-os: #FFA940; --sec-script: #FFA940; --sec-security: #FFA940;
    --danger: #FF5E3A; --warning: #FFA940; --success: #6FCF52; --correct: #6FCF52; --incorrect: #FF5E3A;
    --term-green: #6FCF52;
    --glow-amber: 0 0 6px rgba(255, 169, 64, 0.55);
    --glow-green: 0 0 6px rgba(111, 207, 82, 0.55);
    --glow-red: 0 0 6px rgba(255, 94, 58, 0.55);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: 'JetBrains Mono', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 64px; }
  .app { width: 100%; max-width: 720px; }
  .card { background: var(--paper-dark); border: 1px solid var(--line); border-radius: 1px; padding: 28px; }
  .card-tappable { cursor: pointer; }
  .btn-icon { display: inline-flex; vertical-align: middle; margin-right: 5px; position: relative; top: -1px; }
  .btn-icon svg { display: block; }
  @media (hover: hover) { .card-tappable:hover { border-color: var(--ink-muted); } }
  .back-link { display: inline-block; margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.03em; color: var(--ink-muted); cursor: pointer; }
  .picker-title { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .picker-subtitle { font-size: 13px; color: var(--ink-muted); margin-bottom: 18px; }
  .picker-toolbar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .picker-toolbar button { background: var(--paper-darker); border: 1px solid var(--line); color: var(--ink-muted); border-radius: 1px; padding: 6px 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em; cursor: pointer; }
  .picker-toolbar button:hover { color: var(--ink); border-color: var(--ink-muted); }
  .picker-section { margin-bottom: 20px; }
  .picker-section:last-child { margin-bottom: 0; }
  .picker-section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .picker-section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .picker-section-name { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); }
  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .topic-row { display: flex; align-items: center; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 1px; padding: 8px 10px; font-size: 12.5px; cursor: pointer; }
  .topic-row.checked { border-color: var(--sec-net); background: rgba(61,107,117,0.1); }
  .topic-checkbox { width: 14px; height: 14px; border-radius: 1px; border: 1.5px solid var(--ink-muted); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--paper); }
  .topic-row.checked .topic-checkbox { background: var(--sec-net); border-color: var(--sec-net); }
  .topic-name { flex: 1; }
  .topic-pct { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-muted); }
  .topic-learn-link { flex-shrink: 0; text-decoration: none; font-size: 12px; opacity: 0.65; padding: 2px 4px; }
  .topic-learn-link:hover { opacity: 1; }
  .picker-footer { position: sticky; bottom: 16px; margin-top: 20px; background: var(--paper-dark); border: 1.5px solid var(--line); color: var(--ink-muted); text-align: center; padding: 13px; border-radius: 1px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .picker-footer.active { background: var(--paper-dark); border-color: var(--ink); box-shadow: var(--glow-amber); color: var(--ink); font-weight: 600; letter-spacing: 0.02em; cursor: pointer; text-shadow: var(--glow-amber); }
  @media (max-width: 480px) { .topic-grid { grid-template-columns: 1fr; } }
  .back-link:hover { color: var(--ink); }
  .countdown-row { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 20px; }
  .strength-label { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin: 0 0 10px; }
  .status-line-list { margin-bottom: 8px; }
  .status-line-row { display: flex; align-items: center; gap: 10px; padding: 15px 14px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 13px; border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); border-radius: 1px; margin-bottom: 10px; min-height: 44px; box-sizing: border-box; }
  .status-line-row:hover { background: var(--paper-darker); }
  .status-line-bar { letter-spacing: -1px; color: var(--line); flex-shrink: 0; }
  .status-line-label { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-shadow: var(--glow-amber); }
  .status-line-flag { color: var(--brass); font-size: 11px; text-shadow: var(--glow-amber); }
  .status-line-pct { font-weight: 700; flex-shrink: 0; text-align: right; min-width: 38px; }
  .status-line-pct.danger { color: var(--stamp-red); text-shadow: var(--glow-red); }
  .status-line-pct.warning { color: var(--brass); text-shadow: var(--glow-amber); }
  .status-line-pct.success { color: var(--field-green); text-shadow: var(--glow-green); }
  .topic-picker-btn { display: block; width: 100%; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); border-radius: 1px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 13.5px; cursor: pointer; margin-bottom: 14px; text-align: center; text-shadow: var(--glow-amber); }
  .topic-picker-btn:hover { opacity: 0.9; }
  .manage-details { margin-bottom: 16px; }
  .manage-summary { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); cursor: pointer; padding: 8px 0; }
  .manage-details[open] .manage-summary { margin-bottom: 8px; }
  .manage-body { display: flex; flex-direction: column; gap: 2px; }
  .manage-link { background: none; border: none; color: var(--ink-muted); font-size: 12px; cursor: pointer; padding: 13px 0; margin: 0; text-decoration: underline; text-align: left; }
  .manage-link-danger { color: var(--stamp-red); text-decoration: none; }
  .weak-primary-card { background: rgba(138, 106, 38, 0.1); border: 1.5px solid var(--brass); border-radius: 1px; padding: 16px 18px; margin-bottom: 20px; cursor: pointer; transition: transform 0.1s ease; }
  .weak-primary-card:hover { transform: translateY(-1px); }
  .weak-primary-label { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--brass); font-weight: 600; margin-bottom: 6px; }
  .weak-primary-title { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .weak-primary-desc { font-size: 12.5px; color: var(--ink-muted); line-height: 1.5; }
  .weak-bar { background: rgba(138, 106, 38, 0.1); border: 1.5px solid var(--brass); border-radius: 1px; padding: 12px 14px; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: transform 0.1s ease; }
  .weak-bar:hover { transform: translateY(-1px); }
  .weak-bar-label { color: var(--brass); font-size: 13px; font-weight: 600; }
  .weak-bar-arrow { color: var(--brass); font-size: 13px; }
  .weakspots-card { background: var(--paper-dark); border: 1px solid var(--brass); border-radius: 1px; padding: 16px 18px; margin-bottom: 20px; }
  .weakspots-practice-all { margin-top: 10px; background: rgba(138, 106, 38, 0.12); border-radius: 1px; padding: 10px; text-align: center; color: var(--brass); font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .weakspots-practice-all:hover { background: rgba(138, 106, 38, 0.2); }
  .weakspots-practice-all-disabled { margin-top: 10px; border: 1px dashed var(--line); border-radius: 1px; padding: 10px; text-align: center; color: var(--ink-muted); font-size: 11.5px; opacity: 0.75; }
  .weakspots-label { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin-bottom: 10px; }
  .weakspot-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .weakspot-row:last-child { border-bottom: none; }
  .weakspot-name { font-size: 13px; color: var(--ink); }
  .weakspot-section { font-size: 10.5px; color: var(--ink-muted); margin-left: 4px; }
  .weakspot-right { display: flex; align-items: center; gap: 12px; }
  .weakspot-pct { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; }
  .weakspot-practice { font-size: 11.5px; color: var(--ink-muted); cursor: pointer; white-space: nowrap; }
  .weakspot-practice:hover { color: var(--ink); }
  .weakspots-more { margin-top: 4px; }
  .weakspots-more summary { font-size: 11.5px; color: var(--ink-muted); cursor: pointer; padding: 6px 0; }
  .weakspots-more summary:hover { color: var(--ink); }
  .weakspots-more[open] summary { margin-bottom: 4px; }
  .ref-details { margin-top: 16px; }
  .ref-summary { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); cursor: pointer; padding: 8px 0; }
  .ref-details[open] .ref-summary { margin-bottom: 8px; }
  .ref-label { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-muted); margin: 0 0 10px; }
  .ref-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .ref-item { background: var(--paper-darker); border-radius: 1px; padding: 10px 12px; font-size: 12.5px; color: var(--ink-muted); }
  .ref-item b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 2px; font-size: 12.5px; }
  .ref-item-wide { grid-column: 1 / -1; }
  .ref-link { color: var(--sec-net); text-decoration: none; display: block; }
  .ref-link:hover { text-decoration: underline; }
  .ref-link-row { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 2px; }
  .ref-link-row .ref-link { display: inline; }
  .practice-btn { background: var(--sec-script); color: var(--paper); border: none; border-radius: 1px; padding: 14px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 14.5px; cursor: pointer; width: 100%; }
  .dash-weak-btn { background: rgba(138, 106, 38, 0.12); border: 1.5px solid var(--brass); border-radius: 1px; padding: 12px; cursor: pointer; text-align: center; color: var(--brass); font-weight: 700; font-size: 13.5px; }
  .dash-weak-disabled { border: 1.5px dashed var(--line); border-radius: 1px; padding: 12px; text-align: center; color: var(--ink-muted); font-size: 12.5px; opacity: 0.7; }
  .edit-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
  .edit-row label { font-size: 13px; flex: 1; }
  .edit-row input { width: 70px; background: var(--paper); border: 1.5px solid var(--line); color: var(--ink); border-radius: 1px; padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
  .edit-save-btn { background: var(--field-green); color: var(--paper); border: none; border-radius: 1px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 13.5px; cursor: pointer; width: 100%; margin-top: 16px; }
  .confirm-danger-btn { display: block; width: 100%; background: var(--stamp-red); color: var(--paper); border: none; border-radius: 1px; padding: 14px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 14px; cursor: pointer; margin-top: 4px; }
  .confirm-danger-btn:hover { opacity: 0.9; }
  .header { margin-bottom: 28px; }
  .header-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .header-title { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-muted); text-transform: uppercase; }
  .header-count { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink-muted); }
  .header-right { display: flex; align-items: center; gap: 14px; }
  @media (max-width: 480px) {
    .header-top { flex-wrap: wrap; row-gap: 6px; }
    .header-right { flex-wrap: wrap; gap: 8px 12px; width: 100%; justify-content: space-between; }
  }
  .header-exit { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-muted); cursor: pointer; display: inline-flex; align-items: center; padding: 13px 4px; margin: -13px -4px; }
  .header-exit:hover { color: var(--ink); }
  .tally { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
  .tally-correct { color: var(--field-green); font-weight: 700; }
  .tally-incorrect { color: var(--stamp-red); font-weight: 700; }
  .progress-bar-ascii { font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: -1px; color: var(--line); }
  .bar-filled { letter-spacing: -1px; text-shadow: var(--glow-amber); }
  .round-type-tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 2px; background: var(--sec-script); color: var(--paper); text-shadow: var(--glow-amber); }
  .round-type-tag::before { content: "["; } .round-type-tag::after { content: "]"; }
  .round-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .q-text { font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.6; color: var(--ink); margin-bottom: 14px; text-shadow: var(--glow-amber); }
  .q-text::before { content: "? "; color: var(--brass); font-weight: 700; }
  .q-diagram { margin-bottom: 16px; padding: 14px; background: var(--ink-black); border: 1px solid var(--line); border-radius: 1px; }
  .q-diagram svg { display: block; width: 100%; height: auto; max-width: 100%; }
  .q-terminal { border-radius: 1px; overflow: hidden; margin-bottom: 22px; position: relative; }
  .q-terminal::after { content: ""; position: absolute; top: 34px; bottom: 0; right: 0; width: 28px; pointer-events: none; background: linear-gradient(to right, transparent, var(--ink-black)); }
  .q-terminal-header { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #14100A; }
  .q-terminal-dot { width: 9px; height: 9px; border-radius: 50%; }
  .q-terminal-title { margin-left: 6px; font-size: 11px; color: var(--ink-muted); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-code { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.6; color: var(--ink); background: var(--ink-black); padding: 14px 16px; white-space: pre; overflow-x: auto; position: relative; text-shadow: var(--glow-amber); }
  @media (max-width: 480px) {
    .q-code { font-size: 12px; padding: 12px 14px; }
    .q-text { font-size: 14px; }
    .choice { font-size: 13.5px; padding: 12px 14px; }
    .feedback-explanation { font-size: 13px; }
  }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .bpf-input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .bpf-prompt { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--ink); font-size: 15px; text-shadow: var(--glow-amber); }
  .bpf-input { flex: 1; background: var(--ink-black); border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 11px 12px; border-radius: 1px; min-height: 44px; box-sizing: border-box; text-shadow: var(--glow-amber); }
  .bpf-input:focus { outline: none; border-color: var(--field-green); }
  .bpf-input.locked { opacity: 0.85; }
  .bpf-input.locked.correct-answer { border-color: var(--correct); color: var(--correct); }
  .bpf-input.locked.wrong-selected { border-color: var(--incorrect); color: var(--incorrect); }
  .bpf-submit-btn { display: block; width: 100%; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); padding: 13px; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 14px; border-radius: 1px; text-shadow: var(--glow-amber); }
  .choice { background: var(--paper); border: 1.5px solid var(--line); border-radius: 1px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 14.5px; line-height: 1.5; color: var(--ink); transition: border-color 0.15s ease, transform 0.1s ease; text-align: left; text-shadow: var(--glow-amber); }
  .choice:hover:not(.locked) { border-color: var(--ink-muted); transform: translateY(-1px); }
  .choice-letter { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--ink-muted); flex-shrink: 0; }
  .choice-text { flex: 1; min-width: 0; overflow-wrap: break-word; word-break: break-word; }
  .choice.correct-answer { border-color: var(--field-green); background: rgba(111, 207, 82, 0.1); box-shadow: var(--glow-green); text-shadow: var(--glow-green); }
  .choice.correct-answer .choice-letter { color: var(--field-green); }
  .choice.wrong-selected { border-color: var(--stamp-red); background: rgba(255, 94, 58, 0.1); box-shadow: var(--glow-red); text-shadow: var(--glow-red); }
  .choice.wrong-selected .choice-letter { color: var(--stamp-red); }
  .choice.locked { cursor: default; }
  .choice.dimmed { opacity: 0.45; }
  .feedback { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); display: none; }
  .feedback.show { display: block; }
  .feedback-verdict { font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 14px; margin-bottom: 8px; overflow-wrap: break-word; word-break: break-word; }
  .feedback-verdict.correct { color: var(--field-green); text-shadow: var(--glow-green); }
  .feedback-verdict.incorrect { color: var(--stamp-red); text-shadow: var(--glow-red); }
  .feedback-explanation { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; line-height: 1.55; color: var(--ink-muted); overflow-wrap: break-word; word-break: break-word; }
  .feedback-explanation::before { content: "# "; }
  .nav-arrows { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
  .nav-arrow-btn { background: transparent; color: var(--ink-muted); border: 1.5px solid var(--line); border-radius: 1px; padding: 14px 22px; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 16px; cursor: pointer; min-width: 60px; }
  .nav-arrow-btn.hidden { visibility: hidden; }
  .nav-arrow-btn:hover { color: var(--ink); border-color: var(--ink); }
  .report-score { text-align: center; padding: 8px 0 24px; }
  .report-score-num { font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 700; }
  .report-score-label { font-family: 'JetBrains Mono', monospace; color: var(--ink-muted); font-size: 13px; margin-top: 4px; letter-spacing: 0.02em; }
  .report-row { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .report-row:last-child { border-bottom: none; }
  .report-row-name { flex: 1.4; font-size: 13.5px; }
  .report-row-bar { flex: 1; height: 8px; background: var(--line); border-radius: 1px; overflow: hidden; }
  .report-row-fill { height: 100%; border-radius: 1px; background: var(--sec-script); }
  .report-row-pct { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--ink-muted); width: 50px; text-align: right; }
  .restart-btn { display: block; width: 100%; margin-top: 20px; background: transparent; color: var(--ink); border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); border-radius: 1px; padding: 12px; font-family: 'JetBrains Mono', monospace; font-weight: 600; letter-spacing: 0.02em; font-size: 14px; cursor: pointer; text-shadow: var(--glow-amber); }
  .empty-note { font-size: 11px; color: var(--ink-muted); font-style: italic; line-height: 1.5; }
  .pomo-widget { background: var(--paper-darker); border: 1.5px solid var(--ink); box-shadow: var(--glow-amber); border-radius: 1px; padding: 8px 12px; text-align: center; flex-shrink: 0; }
  .pomo-standalone-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .pomo-top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .pomo-icon-row { display: flex; align-items: center; gap: 10px; }

<script>










































// Ported from scripting_quiz.py -- every "correct" answer is computed by
// actually running equivalent logic, never hand-derived. Decoys use the
// same safety pattern throughout: a bounded random-search phase (max 30
// attempts) followed by a guaranteed-unique index-based fallback, so no
// generator can hang or produce colliding options, matching the fixes
// already made and tested in the Python original.

function randInt(min, max) { // inclusive both ends, matches Python's random.randint
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function randSample(arr, n) { // sample without replacement, matches random.sample
  const pool = arr.slice(); const result = [];
  for (let i = 0; i < n; i++) { const idx = Math.floor(Math.random() * pool.length); result.push(pool[idx]); pool.splice(idx, 1); }
  return result;
}
function rangeArr(start, end) { const r = []; for (let i = start; i < end; i++) r.push(i); return r; }
function sumRange(start, end) { let t = 0; for (let i = start; i < end; i++) t += i; return t; }
function pyListStr(arr) { return "[" + arr.join(", ") + "]"; } // matches Python's list repr exactly

function genSumLoop() {
  const start = randInt(1, 5);
  const end = randInt(start + 3, start + 9);
  const correct = sumRange(start, end);
  const code = `total = 0\nfor i in range(${start}, ${end}):\n    total += i\nprint(total)`;
  const candidates = new Set([sumRange(start, end + 1), sumRange(0, end), sumRange(start + 1, end), correct + end]);
  candidates.delete(correct);
  let decoys = [...candidates].map(String).slice(0, 3);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const d = correct + randInt(-20, 20);
    if (d !== correct && !decoys.includes(String(d))) decoys.push(String(d));
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  return { category: "sum_loop", code, prompt: "What does this code print?", correct: String(correct), decoys: decoys.slice(0, 3), explanation: `range(${start}, ${end}) produces ${start} through ${end - 1}; adding them up gives ${correct}.` };
}

function genListComp() {
  const n = randInt(6, 13);
  const mod = randChoice([2, 3]);
  const mult = randChoice([2, 3]);
  const correctArr = rangeArr(0, n).filter(x => x % mod === 0).map(x => x * mult);
  const correct = pyListStr(correctArr);
  const code = `result = [x*${mult} for x in range(${n}) if x % ${mod} == 0]\nprint(result)`;

  const otherRemainder = mod === 2 ? 1 : randChoice([1, 2]);
  const cand1 = rangeArr(0, n).filter(x => x % mod === otherRemainder).map(x => x * mult);
  const cand2 = rangeArr(0, n).filter(x => x % mod === 0);
  const cand3 = rangeArr(0, n + 1).filter(x => x % mod === 0).map(x => x * mult);
  let decoys = [];
  for (const c of [cand1, cand2, cand3]) {
    const s = pyListStr(c);
    if (s !== correct && !decoys.includes(s)) decoys.push(s);
  }
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    let alt = correctArr.slice();
    if (alt.length) alt.push(alt[alt.length - 1] + mult + randInt(1, 5));
    else alt = [randInt(1, 10)];
    const s = pyListStr(alt);
    if (s !== correct && !decoys.includes(s)) decoys.push(s);
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  return { category: "list_comp", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation: `range(${n}) filtered to values divisible by ${mod}, each multiplied by ${mult}, gives ${correct}.` };
}

function fact(k) { return k <= 1 ? 1 : k * fact(k - 1); }
function genFactorial() {
  const n = randInt(3, 6);
  const correct = fact(n);
  const code = `def fact(n):\n    if n <= 1:\n        return 1\n    return n * fact(n-1)\nprint(fact(${n}))`;
  const candidates = new Set([fact(n - 1), fact(n + 1), correct - n, correct + n]);
  candidates.delete(correct);
  let decoys = [...candidates].map(String).slice(0, 3);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const d = correct + randInt(-2 * n, 2 * n);
    if (d !== correct && d > 0 && !decoys.includes(String(d))) decoys.push(String(d));
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  const factorChain = Array.from({ length: n }, (_, i) => n - i).join(" \u00d7 ");
  return { category: "factorial", code, prompt: "What does this code print?", correct: String(correct), decoys: decoys.slice(0, 3), explanation: `fact(${n}) = ${factorChain} = ${correct}.` };
}

function genBinarySearch() {
  const n = randChoice([7, 9, 11]);
  const arr = randSample(rangeArr(1, 100), n).sort((a, b) => a - b);
  const targetIdx = randInt(0, n - 1);
  const target = arr[targetIdx];
  let low = 0, high = n - 1, comparisons = 0, foundIdx = null;
  const trace = [];
  while (low <= high) {
    const mid = Math.floor((low + high) / 2);
    comparisons++;
    if (arr[mid] === target) { foundIdx = mid; trace.push(`arr[${mid}]=${arr[mid]} matches the target`); break; }
    else if (arr[mid] < target) { trace.push(`arr[${mid}]=${arr[mid]} is less than ${target}, so search moves right`); low = mid + 1; }
    else { trace.push(`arr[${mid}]=${arr[mid]} is greater than ${target}, so search moves left`); high = mid - 1; }
  }
  const correct = `Index ${foundIdx}, after ${comparisons} comparisons`;
  const code = `arr = ${pyListStr(arr)}\ntarget = ${target}\n# Binary search: repeatedly check the midpoint of this SORTED array`;

  const decoys = new Set();
  decoys.add(`Index ${foundIdx}, after ${comparisons + 1} comparisons`);
  if (comparisons > 1) decoys.add(`Index ${foundIdx}, after ${comparisons - 1} comparisons`);
  decoys.add(`Index ${foundIdx}, after ${n} comparisons`);
  decoys.add(`Index ${(foundIdx + 1) % n}, after ${comparisons} comparisons`);
  decoys.delete(correct);
  let decoyList = [...decoys].slice(0, 3);
  let attempts = 0;
  while (decoyList.length < 3 && attempts < 30) {
    attempts++;
    const alt = `Index ${randInt(0, n - 1)}, after ${Math.max(1, comparisons + randInt(-3, 3))} comparisons`;
    if (alt !== correct && !decoyList.includes(alt)) decoyList.push(alt);
  }
  while (decoyList.length < 3) decoyList.push(`(invalid option ${decoyList.length})`);
  const explanation = trace.map((step, i) => `Step ${i + 1}: ${step}.`).join(" ");
  return { category: "binary_search", code, prompt: "Using binary search on this sorted array, at what index is the target found, and how many comparisons does it take?", correct, decoys: decoyList.slice(0, 3), explanation };
}

function genBubbleSort() {
  const n = randInt(4, 5);
  const arr = randSample(rangeArr(1, 20), n);
  const working = arr.slice();
  const swaps = [];
  for (let i = 0; i < working.length - 1; i++) {
    if (working[i] > working[i + 1]) {
      swaps.push(`${working[i]} and ${working[i + 1]} are swapped (${working[i]} > ${working[i + 1]})`);
      const t = working[i]; working[i] = working[i + 1]; working[i + 1] = t;
    }
  }
  const correct = pyListStr(working);
  const code = `arr = ${pyListStr(arr)}\nfor i in range(len(arr) - 1):\n    if arr[i] > arr[i + 1]:\n        arr[i], arr[i + 1] = arr[i + 1], arr[i]\nprint(arr)  # after this one pass`;

  const candidates = [pyListStr(arr.slice().sort((a, b) => a - b)), pyListStr(arr.slice()), pyListStr(arr.slice().reverse())];
  let decoys = [];
  for (const c of candidates) if (c !== correct && !decoys.includes(c)) decoys.push(c);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const alt = working.slice();
    const i = randInt(0, alt.length - 1), j = randInt(0, alt.length - 1);
    const t = alt[i]; alt[i] = alt[j]; alt[j] = t;
    const s = pyListStr(alt);
    if (s !== correct && !decoys.includes(s)) decoys.push(s);
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  const explanation = swaps.length ? `During this one pass: ${swaps.join("; ")}. Result: ${correct}.` : `No adjacent pair is out of order during this one pass, so the array is unchanged: ${correct}.`;
  return { category: "bubble_sort", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation };
}

const SYNTAX_POOL = [
  ["Reading a variable in bash", "$VAR", ["%VAR%", "VAR$", "#VAR"], "Bash prefixes a variable name with $ to read its value; %VAR% is cmd/batch syntax, and VAR$/#VAR aren't valid in any of these shells."],
  ["Reading a variable in cmd/batch", "%VAR%", ["$VAR", "VAR$", "&VAR"], "Windows cmd/batch wraps a variable name in percent signs to read its value; $VAR is bash/PowerShell syntax instead."],
  ["Reading a variable in PowerShell", "$VAR", ["%VAR%", "@VAR", "VAR$"], "PowerShell, like bash, prefixes variable names with $; %VAR% is cmd/batch syntax, and @VAR denotes an array in PowerShell, not a simple variable read."],
  ["Command substitution in bash (capture output as a string)", "$(command)", ["`command`", "%command%", "${command}"], "$(command) runs the command and substitutes its output as text; backticks are an older, harder-to-nest equivalent, while %command% and ${command} aren't valid substitution syntax."],
  ["Checking the previous command's exit code in bash", "$?", ["%ERRORLEVEL%", "$LASTEXITCODE", "$EXIT"], "$? holds the exit status of the most recently run command in bash; %ERRORLEVEL% and $LASTEXITCODE are the cmd and PowerShell equivalents."],
  ["Checking the previous command's exit code in cmd/batch", "%ERRORLEVEL%", ["$?", "$LASTEXITCODE", "%EXIT%"], "cmd/batch stores the previous command's exit code in %ERRORLEVEL%; $? is bash's equivalent, and $LASTEXITCODE is PowerShell's."],
  ["Checking the previous command's exit code in PowerShell", "$LASTEXITCODE", ["%ERRORLEVEL%", "$?", "$EXITCODE"], "PowerShell stores the exit code of the last native command in $LASTEXITCODE; $? instead reflects success/failure as a boolean, not the numeric code."],
  ["Perl's array sigil", "@", ["$", "%", "&"], "Perl uses @ to denote arrays (e.g., @array); $ marks scalars and % marks hashes."],
  ["Perl's scalar sigil", "$", ["@", "%", "&"], "Perl uses $ to denote scalar variables (e.g., $name), even when accessing a single element of an array or hash; @ marks arrays and % marks hashes."],
  ["Perl's hash sigil", "%", ["@", "$", "&"], "Perl uses % to denote hashes (e.g., %map); @ marks arrays and $ marks scalars."],
  ["Declaring a lexically-scoped variable in Perl", "my $var", ["$var", "var $var", "let $var"], "Perl's my keyword declares a lexically-scoped variable, visible only within its enclosing block; omitting my instead creates a global/package variable."],
  ["A for-loop in bash", "for i in 1 2 3; do ... done", ["for (i=1;i<=3;i++) { ... }", "FOR /L %i IN (1,1,3) DO ...", "foreach ($i in 1..3) { ... }"], "Bash's for loop iterates over a list of words using for ... in ... do ... done; the curly-brace form resembles C/Java, FOR /L is cmd/batch's loop syntax, and foreach is PowerShell's."],
];
let lastSyntaxUsed = null;
function genSyntax() {
  const available = SYNTAX_POOL.filter(item => item[0] !== lastSyntaxUsed);
  const pool = available.length ? available : SYNTAX_POOL;
  const choice = randChoice(pool);
  lastSyntaxUsed = choice[0];
  return { category: "syntax", prompt: choice[0], code: null, correct: choice[1], decoys: choice[2], explanation: choice[3] };
}

function genNestedLoop() {
  const a = randInt(3, 5);
  const result = [];
  for (let i = 0; i < a; i++) {
    for (let j = 0; j < i; j++) result.push(j);
  }
  const correct = pyListStr(result);
  const code = `result = []\nfor i in range(${a}):\n    for j in range(i):\n        result.append(j)\nprint(result)`;

  const flatSum = [];
  for (let i = 0; i < a; i++) for (let j = 0; j <= i; j++) flatSum.push(j); // off-by-one: <= instead of <
  const reversed = result.slice().reverse();
  const doubled = result.map(x => x * 2);
  const candidates = [pyListStr(flatSum), pyListStr(reversed), pyListStr(doubled)];
  let decoys = [];
  for (const c of candidates) if (c !== correct && !decoys.includes(c)) decoys.push(c);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const alt = result.slice();
    if (alt.length) { const idx = randInt(0, alt.length - 1); alt[idx] = alt[idx] + randInt(1, 3); }
    else alt.push(randInt(1, 5));
    const s = pyListStr(alt);
    if (s !== correct && !decoys.includes(s)) decoys.push(s);
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  return { category: "nested_loop", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation: `For i from 0 to ${a - 1}, the inner loop runs j from 0 up to (not including) i and appends it, giving ${correct}.` };
}

function genStringOps() {
  const words = ["PYTHON", "BASH", "KERNEL", "SUBNET", "SCRIPT"];
  const word = randChoice(words);
  const start = randInt(0, word.length - 3);
  const end = randInt(start + 1, Math.min(start + 3, word.length));
  const correct = word.slice(start, end) + word[0];
  const code = `s = "${word}"\nresult = s[${start}:${end}] + s[0]\nprint(result)`;

  const candidates = [
    word.slice(start, end + 1) + word[0], // off-by-one on the end index
    word[0] + word.slice(start, end), // reversed concatenation order
    word.slice(start, end) + word[word.length - 1], // wrong index (last char instead of first)
  ];
  let decoys = [];
  for (const c of candidates) if (c !== correct && !decoys.includes(c)) decoys.push(c);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const randStart = randInt(0, word.length - 2);
    const randEnd = randInt(randStart + 1, word.length);
    const alt = word.slice(randStart, randEnd) + word[randInt(0, word.length - 1)];
    if (alt !== correct && !decoys.includes(alt)) decoys.push(alt);
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  return { category: "string_ops", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation: `s[${start}:${end}] takes characters from index ${start} up to (not including) ${end}: "${word.slice(start, end)}". Adding s[0] ("${word[0]}") gives "${correct}".` };
}

function genDictOps() {
  const n = randInt(4, 7);
  const k = randInt(0, n - 1);
  const d = {};
  for (let i = 0; i < n; i++) d[i] = i * i;
  const correct = String(d[k]);
  const code = `d = {}\nfor i in range(${n}):\n    d[i] = i * i\nprint(d[${k}])`;

  const candidates = new Set([String(k * k + k), String((k + 1) * (k + 1)), String(k * n)]);
  candidates.delete(correct);
  let decoys = [...candidates].slice(0, 3);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const d2 = k * k + randInt(-5, 5);
    if (d2 >= 0 && String(d2) !== correct && !decoys.includes(String(d2))) decoys.push(String(d2));
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  return { category: "dict_ops", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation: `d[${k}] was set to ${k} \u00d7 ${k} = ${correct}.` };
}

function genWhileLoop() {
  let n = randInt(5, 20);
  const startN = n;
  let count = 0;
  const safetyLimit = 200;
  const sequence = [startN];
  while (n > 1 && count < safetyLimit) {
    if (n % 2 === 0) n = n / 2;
    else n = n * 3 + 1;
    count++;
    sequence.push(n);
  }
  const correct = String(count);
  const code = `n = ${startN}\ncount = 0\nwhile n > 1:\n    if n % 2 == 0:\n        n = n // 2\n    else:\n        n = n * 3 + 1\n    count += 1\nprint(count)`;

  const candidates = new Set([String(count + 1), String(Math.max(0, count - 1)), String(count * 2)]);
  candidates.delete(correct);
  let decoys = [...candidates].slice(0, 3);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const d = count + randInt(-4, 4);
    if (d >= 0 && String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d));
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  const explanation = `Starting from ${startN}: ${sequence.join(" \u2192 ")}. That's ${count} steps to reach 1.`;
  return { category: "while_loop", code, prompt: "What does this code print?", correct, decoys: decoys.slice(0, 3), explanation };
}

// Computes the TRUE worst-case comparison count for binary search on n
// elements via actual exhaustive simulation (every possible target position),
// not a memorized formula -- verified separately to match the formula
// ceil(log2(n+1)) across many sizes, but computed here the same way the
// dashboard's own genBinarySearch already works: by running the logic, not
// citing a result.
function worstCaseBinaryComparisons(n) {
  let maxComparisons = 0;
  for (let target = 0; target < n; target++) {
    let low = 0, high = n - 1, comparisons = 0;
    while (low <= high) {
      const mid = Math.floor((low + high) / 2);
      comparisons++;
      if (mid === target) break;
      else if (mid < target) low = mid + 1;
      else high = mid - 1;
    }
    if (comparisons > maxComparisons) maxComparisons = comparisons;
  }
  return maxComparisons;
}
function genBinaryWorstCase() {
  const n = randChoice([50, 100, 250, 500, 1000, 2000, 4000, 8000]);
  const correct = String(worstCaseBinaryComparisons(n));
  const code = null;
  const prompt = `A sorted list contains exactly ${n} elements. What is the maximum number of comparisons binary search will ever need to find a target (or determine it isn't present)?`;
  const candidates = new Set([String(n), String(Math.round(n / 2)), String(parseInt(correct, 10) + 1), String(Math.max(1, parseInt(correct, 10) - 1))]);
  candidates.delete(correct);
  let decoys = [...candidates].slice(0, 3);
  let attempts = 0;
  while (decoys.length < 3 && attempts < 30) {
    attempts++;
    const d = parseInt(correct, 10) + randInt(-3, 3);
    if (d > 0 && String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d));
  }
  while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
  const explanation = `Binary search's worst case is \u230alog\u2082(n)\u230b + 1 comparisons. For n=${n}, log\u2082(${n}) \u2248 ${Math.log2(n).toFixed(2)}, so \u230a${Math.log2(n).toFixed(2)}\u230b + 1 = ${correct}.`;
  return { category: "binary_worst_case", code, prompt, correct, decoys: decoys.slice(0, 3), explanation };
}

const INTERPOLATION_POOL = [
  ["interpolation_search", "What is the key mechanical difference between interpolation search and binary search in how each chooses the next position to check?",
   "Interpolation search estimates a position based on the target's value relative to the range; binary search always checks the exact midpoint regardless of value",
   ["Interpolation search always checks the exact midpoint, while binary search estimates a position based on value", "Interpolation search checks every element in sequence, while binary search skips every other one", "There is no real difference -- both algorithms always check the same position given the same array"],
   "Binary search always splits at the midpoint no matter what the values are. Interpolation search instead estimates roughly where the target should fall based on its value -- the same way you'd guess where 'M' falls in a phone book rather than opening exactly to the middle."],
  ["interpolation_search", "Under what condition does interpolation search perform closest to its best-case efficiency of O(log log n)?",
   "When the sorted data is uniformly distributed across its range",

const GENERATORS = [genSumLoop, genListComp, genFactorial, genBinarySearch, genBubbleSort, genNestedLoop, genStringOps, genDictOps, genWhileLoop, genBinaryWorstCase];

let lastInterpolationCategory = null;
function genFromInterpolationPool() {
  const [category, prompt, correct, decoys, explanation] = randChoice(INTERPOLATION_POOL);
  return { category, code: null, prompt, correct, decoys, explanation };
}

let usedScriptingPrompts = new Set(); // reset per session in startPractice()
function generateQuizRound() {
  // Each source needs its OWN dedicated roll range where it's listed first --
  // putting multiple large-value-space sources in one shared list doesn't
  // achieve weighting, since whichever is listed first will almost always
  // succeed immediately and the rest are never actually reached. (Caught this
  // as a real bug: genFromInterpolationPool never appeared in 2000 real calls
  // under the previous shared-list version.)
  const roll = Math.random();
  let orderedSources;
  if (roll < 0.20) orderedSources = [genSyntax, ...shuffleArray(GENERATORS), genFromInterpolationPool];
  else if (roll < 0.28) orderedSources = [genFromInterpolationPool, genSyntax, ...shuffleArray(GENERATORS)];
  else orderedSources = [...shuffleArray(GENERATORS), genSyntax, genFromInterpolationPool];
  let r = null;
  for (const gen of orderedSources) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const candidate = gen();
      const candidatePrompt = candidate.category === "binary_search"
        ? "Trace this binary search. At what index is the target found, and after how many comparisons?" + candidate.code
        : (candidate.prompt || candidate.code || "");
      if (!usedScriptingPrompts.has(candidatePrompt)) { r = candidate; usedScriptingPrompts.add(candidatePrompt); break; }
    }
    if (r) break;
  }
  if (!r) r = genSyntax(); // safe fallback, not reachable within a 15-question session given the generators' value spaces
  const prompt = r.prompt ? r.prompt : (r.category === "binary_search" ? "Trace this binary search. At what index is the target found, and after how many comparisons?" : "What does the following code print?");
  const options = shuffleArray([...r.decoys, r.correct]);
  const labels = ["A", "B", "C", "D"];
  const choicesMap = {}; labels.forEach((l, i) => choicesMap[l] = options[i]);
  const correctLetter = labels.find(l => choicesMap[l] === r.correct);
  return { category: r.category, code: r.code, prompt, choicesMap, correctLetter, correctAnswer: r.correct, explanation: r.explanation };
}

// ---------- Networking: subnetting engine (procedural, verified against Python's ipaddress module) ----------
function ipToInt(a, b, c, d) { return ((a << 24) | (b << 16) | (c << 8) | d) >>> 0; }
function intToIp(n) { return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join("."); }
function cidrToMaskInt(cidr) { return cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0; }
function cidrToMask(cidr) { return intToIp(cidrToMaskInt(cidr)); }

function genSubnetHosts() {
  const cidr = randInt(20, 30);
  const hostBits = 32 - cidr;
  const totalAddresses = Math.pow(2, hostBits);
  const usable = totalAddresses - 2;
  const a = randInt(1, 223), b = randInt(0, 255), c = randInt(0, 255);
  const prompt = `A subnet is given as ${a}.${b}.${c}.0/${cidr}. How many usable host addresses does it provide?`;
  const correct = String(usable);
  const decoys = new Set([String(totalAddresses), String(usable + 1), String(Math.max(0, usable - 1)), String(totalAddresses - 1)]);
  decoys.delete(correct);
  let decoyList = [...decoys].slice(0, 3);
  let attempts = 0;
  while (decoyList.length < 3 && attempts < 30) {
    attempts++;
    const d = usable + randInt(-4, 4);
    if (d > 0 && String(d) !== correct && !decoyList.includes(String(d))) decoyList.push(String(d));
  }
  while (decoyList.length < 3) decoyList.push(`(invalid option ${decoyList.length})`);
  const explanation = `A /${cidr} leaves ${hostBits} bits for hosts (32 - ${cidr} = ${hostBits}), giving 2^${hostBits} = ${totalAddresses} total addresses. Subtracting the reserved network and broadcast addresses leaves ${usable} usable hosts.`;
  return { category: "subnet_hosts", prompt, code: null, correct, decoys: decoyList.slice(0, 3), explanation };
}

function genSubnetMask() {
  const cidr = randInt(8, 30);
  const correct = cidrToMask(cidr);
  const prompt = `What is the dotted-decimal subnet mask for a /${cidr} network?`;
  const decoys = new Set([cidrToMask(Math.max(1, cidr - 1)), cidrToMask(Math.min(31, cidr + 1)), cidrToMask(Math.max(1, cidr - 2))]);
  decoys.delete(correct);
  let decoyList = [...decoys].slice(0, 3);
  let attempts = 0;
  while (decoyList.length < 3 && attempts < 30) {
    attempts++;
    const altCidr = Math.max(1, Math.min(31, cidr + randInt(-3, 3)));
    const alt = cidrToMask(altCidr);
    if (alt !== correct && !decoyList.includes(alt)) decoyList.push(alt);
  }
  while (decoyList.length < 3) decoyList.push(`(invalid option ${decoyList.length})`);
  const explanation = `A /${cidr} mask sets the first ${cidr} bits to 1 and the remaining ${32 - cidr} bits to 0. Grouped into four 8-bit octets, that's ${correct}.`;
  return { category: "subnet_mask", prompt, code: null, correct, decoys: decoyList.slice(0, 3), explanation };
}

function genNetworkAddress() {
  const cidr = randInt(20, 28);
  const a = randInt(1, 223), b = randInt(0, 255), c = randInt(0, 255), d = randInt(1, 254);
  const ipInt = ipToInt(a, b, c, d);
  const maskInt = cidrToMaskInt(cidr);
  const networkInt = (ipInt & maskInt) >>> 0;
  const correct = intToIp(networkInt);
  const prompt = `Given the host address ${a}.${b}.${c}.${d}/${cidr}, what is the network address?`;
  const blockSize = Math.pow(2, 32 - cidr);
  const decoys = new Set([
    intToIp((networkInt + blockSize) >>> 0),
    `${a}.${b}.${c}.${d}`,
    intToIp((((networkInt - blockSize) % 4294967296) + 4294967296) % 4294967296),
  ]);
  decoys.delete(correct);
  let decoyList = [...decoys].slice(0, 3);
  let attempts = 0;
  while (decoyList.length < 3 && attempts < 30) {
    attempts++;
    const parts = correct.split(".").map(Number);
    const idx = randInt(0, 3);
    parts[idx] = (parts[idx] + randInt(1, 20)) % 256;
    const alt = parts.join(".");
    if (alt !== correct && !decoyList.includes(alt)) decoyList.push(alt);
  }
  while (decoyList.length < 3) decoyList.push(`(invalid option ${decoyList.length})`);
  const explanation = `The network address comes from ANDing the host address with the subnet mask, which clears every host bit to 0 while leaving the network portion unchanged. For ${a}.${b}.${c}.${d}/${cidr}, that gives ${correct}.`;
  return { category: "network_address", prompt, code: null, correct, decoys: decoyList.slice(0, 3), explanation };
}

uter has routes to the same destination network learned via OSPF (AD 110) and RIP (AD 120). Which does it install?", "The OSPF route, since a lower administrative distance is preferred", ["The RIP route instead, simply because RIP is considered a simpler protocol", "Both routes at once, with traffic load-balanced equally between them", "Neither route at all -- this scenario represents an invalid configuration"], "Administrative distance ranks how trustworthy a routing source is; OSPF's default AD of 110 is lower (more trusted) than RIP's 120, so the router installs the OSPF route when both offer a path to the same destination."], ["routing", "What is the administrative distance of a directly connected route?", "0", ["1", "90", "110"], "A directly connected interface is the most trusted possible route -- there's no routing protocol involved at all, just a physical link -- so it gets the lowest possible administrative distance, 0."], ["routing", "What does a default route (0.0.0.0/0) specify?", "The route to use when no more specific route matches the destination", ["The route used exclusively for handling broadcast traffic on the network", "A route that the router will always ignore under any given circumstance", "The fastest available route, chosen regardless of the actual destination"], "0.0.0.0/0 matches every possible destination, but only as a last resort -- it's used specifically when no other, more specific route in the table matches where a packet is headed."], ["routing", "Between EIGRP (AD 90) and OSPF (AD 110), which would a router prefer if both offered a route to the same network?", "EIGRP, because 90 is a lower administrative distance than 110", ["OSPF instead, simply because it's considered a more widely used standard", "Whichever route happened to be learned first, regardless of its actual AD", "Both routes equally, with traffic being split evenly between the two paths"], "EIGRP's default administrative distance (90) is lower than OSPF's (110), so a router configured with both would prefer the EIGRP-learned route to the same destination."], ["protocols", "What is the primary function of ARP?", "Resolving a known IP address to the corresponding MAC address on the local network segment", ["Resolving a given domain name into its corresponding IP address instead", "Assigning IP addresses automatically to any new devices joining the network", "Encrypting traffic that passes directly between two communicating hosts"], "ARP's job is address resolution -- given a known IP address on the local segment, it discovers the corresponding hardware (MAC) address needed to actually deliver a frame at Layer 2."], ["protocols", "Which protocol does the ping command rely on to test reachability?", "ICMP", ["ARP", "SNMP", "IGMP"], "ping works by sending an ICMP Echo Request and waiting for an ICMP Echo Reply -- ICMP is the entire mechanism ping is built on."], ["protocols", "What does DHCP primarily provide to a client device joining a network?", "Automatic assignment of an IP address and related network configuration", ["Encryption keys specifically used for securing ongoing communication sessions", "A static, permanently fixed hostname assigned once and never changed", "Direct translation of domain names into their corresponding IP addresses"], "DHCP automates the assignment of an IP address, subnet mask, gateway, and other configuration details to a client, sparing the need for manual configuration on every device joining the network."], ["topology", "What is the key distinction between a LAN and a WAN?", "A LAN covers a small, localized area (like one building); a WAN spans a much larger geographic area, often connecting multiple LANs", ["A LAN uses wireless connections only; a WAN uses wired connections exclusively", "A LAN is always considered faster than any WAN, purely by definition", "There is no real distinction between the two -- the terms are fully interchangeable"], "The distinguishing factor is geographic scope: a LAN s the SYN flag signal?", "A request to initiate (synchronize) a new connection", ["A request to immediately and completely close an existing connection", "Confirmation that a piece of data was received correctly and intact", "A signal indicating that the connection in question has since timed out"], "SYN is short for \"synchronize\" -- setting it signals the sender's intent to establish a new connection and synchronize initial sequence numbers with the receiver.", "tcp_header_fields"], ["ports_flags", "What does it mean when a port is reported as \"closed\" rather than \"filtered\" during a scan?", "A host actively responded, indicating no service is listening on that port, as opposed to no response at all", ["The port in question is permanently disabled at the underlying hardware level", "The port is actively running a service, but that service refuses all connections", "The port simply cannot be scanned at all, under any circumstances whatsoever"], "A \"closed\" verdict means the host actually replied, typically with a TCP RST, confirming nothing is listening there; \"filtered\" means no response came back at all, usually because a firewall is silently dropping the probe."], ["ports_flags", "Which TCP flag indicates an abrupt, non-graceful termination of a connection?", "RST", ["SYN", "FIN", "URG"], "RST forcibly and immediately tears down a connection, in contrast to FIN's graceful, both-sides-agree closure -- it's used to abruptly reject or reset an unexpected or invalid connection.", "tcp_header_fields"], ["handshake", "What is the correct order of the TCP three-way handshake?", "SYN, SYN-ACK, ACK", ["ACK, SYN, SYN-ACK", "SYN, ACK, SYN-ACK", "SYN-ACK, SYN, ACK"], "The handshake proceeds in three defined steps: the client sends SYN to request a connection, the server replies with SYN-ACK to acknowledge and synchronize its own sequence number, and the client finishes with ACK."], ["handshake", "During the TCP three-way handshake, what does the second packet (SYN- vely block it", ["An IDS is only ever capable of working with encrypted traffic specifically", "An IPS can only ever be deployed and used on wireless networks specifically", "They are simply two different names used for describing the same exact function"], "An IDS observes a copy of traffic and raises alerts after the fact; an IPS sits directly in the traffic's path, letting it actively drop or block malicious traffic in real time rather than just report on it."], ["standard_services", "What port does DNS primarily use?", "53", ["43", "80", "21"], "DNS listens on port 53 by default, for both the UDP queries typical of most lookups and the TCP connections used for larger transfers like zone transfers.", "port_range_scale"], ["standard_services", "What port does SSH use by default?", "22", ["21", "23", "25"], "SSH's default, universally recognized port is 22."], ["standard_services", "Which port does Telnet use by default?", "23", ["21", "22", "25"], "Telnet's default port is 23, assigned early in the ARPANET era and still standard today even though its lack of encryption has largely displaced it in favor of SSH."], ["standard_services", "What is the key architectural difference between FTP and most other common network services?", "FTP uses two separate ports -- one for control commands (21) and one for actual data transfer (20)", ["FTP doesn't use TCP at all as its transport protocol, relying only on UDP", "FTP actually requires no port number at all in order to function properly", "FTP uses one single shared port for everything it does, exactly like HTTP"], "FTP splits control and data onto separate connections: port 21 handles commands and responses, while port 20 (in active mode) carries the actual file transfer -- most other common services use a single port for everything."], ["standard_services", "What port does Kerberos use by default?", "88", ["89", "443", "8080"], "Kerberos uses port 88 by default for its authentication exchanges."], ["standard_services", "Which port does DHCP use for messages sent from a client to a server?", "68", ["67", "53", "69"], "DHCP messages from client to server use port 68, while the server listens for those requests on port 67 -- the two directions use different port numbers."], ["standard_services", "What port does HTTP use by default?", "80", ["443", "8080", "21"], "HTTP's default port is 80, with HTTPS using 443 instead when encryption is added."], ["windows_services", "What port does the Windows RPC endpoint mapper use?", "135", ["139", "445", "3389"], "Windows RPC's endpoint mapper listens on port 135, helping clients discover which dynamic port a specific RPC service is actually running on."], ["windows_services", "What port range is associated with legacy NetBIOS services?", "137-139", ["135-136", "440-450", "3386-3390"], "Legacy NetBIOS services span ports 137 through 139, covering name resolution (137), datagram (138), and session (139) services."], ["windows_services", "Which port is associated with SMB (Server Message Block) file sharing on modern Windows systems?", "445", ["139", "135", "3389"], "Modern Windows SMB file sharing uses port 445 directly, bypassing the older NetBIOS session layer that earlier SMB implementations relied on."], ["output_interp", "Running netstat -an shows a line ending in \"LISTEN\". What does this state indicate?", "A service is actively bound to that port and waiting for incoming connections", ["The connection in question has already been fully and completely closed", "The port is currently being actively blocked by a configured firewall rule", "Data is actively being transferred back and forth on that specific connection"], "A LISTEN state means a process has bound to that port and is actively waiting to accept incoming connections -- it hasn't established a connection yet, just opened the door for one."], ["service_admin", "Before troubleshooting why a network service seems unreachable, what is a reasonable first administrative check?", "Confirm let lastPoolCategory = null;
function genFromNetworkingPool() {
  // Prefer items whose category differs from the last pool pick, for topic variety
  // within a session -- same spirit as the Scripting engine's syntax pool logic.
  const preferred = NETWORKING_POOL.filter(item => item[0] !== lastPoolCategory);
  const candidates = preferred.length ? preferred : NETWORKING_POOL;
  const [category, prompt, correct, decoys, explanation] = randChoice(candidates);
  lastPoolCategory = category;
  return { category, prompt, code: null, correct, decoys, explanation };
}

// ---------- Networking: netstat scenario engine ----------
// Generates a realistic, internally-consistent netstat-style output block,
// then asks a question computed by actually inspecting that same generated
// data -- never a hand-written answer that could drift from what's shown.
const NETSTAT_SERVICES = [
  { port: 22, name: "SSH" },
  { port: 23, name: "Telnet" },
  { port: 80, name: "HTTP" },
  { port: 21, name: "FTP" },
];

function randomIp() {
  return `${randInt(1, 223)}.${randInt(0, 255)}.${randInt(0, 255)}.${randInt(1, 254)}`;
}

function genNetstatScenario() {
  const numListening = randInt(3, 4);
  const listeningServices = shuffleArray(NETSTAT_SERVICES).slice(0, numListening);
  const lines = [];
  const listenEntries = [];
  listeningServices.forEach(svc => {
    lines.push({ proto: "tcp", local: `0.0.0.0:${svc.port}`, remote: "0.0.0.0:*", state: "LISTEN", service: svc.name, port: svc.port });
    listenEntries.push(svc);
  });

  // Exactly one established connection, to one of the listening services
  const establishedSvc = randChoice(listenEntries);
  const remoteIp = randomIp();
  const remotePort = randInt(30000, 60000);
  lines.push({ proto: "tcp", local: `192.168.1.50:${establishedSvc.port}`, remote: `${remoteIp}:${remotePort}`, state: "ESTABLISHED", service: establishedSvc.name, port: establishedSvc.port });

  const shuffledLines = shuffleArray(lines);
  const textBlock = shuffledLines.map(l => `${l.proto}   ${l.local.padEnd(22)} ${l.remote.padEnd(22)} ${l.state}`).join("\n");

  return { lines: shuffledLines, textBlock, listenCount: listenEntries.length, establishedSvc, remoteIp, remotePort };
}

function genNetstatQuestion() {
  const scenario = genNetstatScenario();
  const qType = randChoice(["count_listen", "which_port", "remote_ip", "which_service_established"]);
  let prompt, correct, decoys, explanation;

  if (qType === "count_listen") {
    prompt = "How many connections in this output are in the LISTEN state?";
    correct = String(scenario.listenCount);
    const candidates = new Set([String(scenario.listenCount + 1), String(Math.max(0, scenario.listenCount - 1)), String(scenario.lines.length)]);
    candidates.delete(correct);
    decoys = [...candidates].slice(0, 3);
    while (decoys.length < 3) { const d = scenario.listenCount + randInt(1, 3); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `Counting the lines whose State column reads LISTEN gives ${scenario.listenCount}.`;
  } else if (qType === "which_port") {
    prompt = `Which port is ${scenario.establishedSvc.name} listening on in this output?`;
    correct = String(scenario.establishedSvc.port);
    const otherPorts = scenario.lines.filter(l => l.port !== scenario.establishedSvc.port).map(l => String(l.port));
    decoys = [...new Set(otherPorts)].slice(0, 3);
    while (decoys.length < 3) { const d = randChoice(NETSTAT_SERVICES).port; if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `${scenario.establishedSvc.name}'s line shows a local address ending in :${scenario.establishedSvc.port}, so that's the port it's bound to.`;
  } else if (qType === "remote_ip") {
    prompt = "What is the remote IP address of the ESTABLISHED connection in this output?";
    correct = scenario.remoteIp;
    decoys = [];
    let attempts = 0;
    while (decoys.length < 3 && attempts < 30) { attempts++; const alt = randomIp(); if (alt !== correct && !decoys.includes(alt)) decoys.push(alt); }
    while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
    explanation = `The ESTABLISHED line's Foreign Address column shows ${scenario.remoteIp} as the remote endpoint.`;
  } else {
    prompt = "Which service has the ESTABLISHED connection in this output?";
    correct = scenario.establishedSvc.name;
    decoys = NETSTAT_SERVICES.filter(s => s.name !== correct).map(s => s.name).slice(0, 3);
    explanation = `The one line with State ESTABLISHED corresponds to ${scenario.establishedSvc.name}, on port ${scenario.establishedSvc.port}.`;

// ---------- Networking: ip route scenario engine ----------
function genRouteScenario() {
  const iface = randChoice(["eth0", "ens33", "wlan0"]);
  const gateway = randomIp();
  const localNet = `192.168.${randInt(0, 254)}.0`;
  const localCidr = 24;
  const localIp = localNet.replace(/\.0$/, "." + randInt(2, 254));
  const hasStaticRoute = Math.random() < 0.6;
  const staticNet = `10.${randInt(0, 254)}.0.0`;
  const staticCidr = 16;
  const staticGateway = localNet.replace(/\.0$/, "." + randInt(2, 254));

  const lines = [
    { type: "default", gateway, iface },
    { type: "connected", network: localNet, cidr: localCidr, iface, src: localIp },
  ];
  if (hasStaticRoute) lines.push({ type: "static", network: staticNet, cidr: staticCidr, gateway: staticGateway, iface });

  const textLines = lines.map(l => {
    if (l.type === "default") return `default via ${l.gateway} dev ${l.iface}`;
    if (l.type === "connected") return `${l.network}/${l.cidr} dev ${l.iface} proto kernel scope link src ${l.src}`;
    return `${l.network}/${l.cidr} via ${l.gateway} dev ${l.iface}`;
  });
  const textBlock = textLines.join("\n");
  return { lines, textBlock, gateway, iface, localIp, hasStaticRoute, staticNet, staticCidr, staticGateway };
}

function genRouteQuestion() {
  const scenario = genRouteScenario();
  const qTypes = scenario.hasStaticRoute ? ["gateway", "iface", "src_ip", "static_route"] : ["gateway", "iface", "src_ip"];

  let prompt, correct, decoys, explanation;

  if (qType === "gateway") {
    prompt = "Based on this output, what is the default gateway?";

    while (decoys.length < 3 && attempts < 30) { attempts++; const alt = randomIp(); if (alt !== correct && !decoys.includes(alt)) decoys.push(alt); }

  } else if (qType === "iface") {

    correct = scenario.iface;
    decoys = ["eth0", "ens33", "wlan0", "eth1"].filter(i => i !== correct).slice(0, 3);
    explanation = `The default route line ends in "dev ${scenario.iface}", naming the interface it goes out through.`;
  } else if (qType === "src_ip") {

    while (decoys.length < 3 && attempts < 30) { attempts++; const alt = randomIp(); if (alt !== correct && !decoys.includes(alt)) decoys.push(alt); }
    while (decoys.length < 3) decoys.push(`(invalid option ${decoys.length})`);
    explanation = `The directly-connected network's line ends in "src ${scenario.localIp}", showing the local interface's own address on that subnet.`;
  } else {
    prompt = "Based on this output, which network is reached via a static route (not the default, and not the directly-connected one)?";

  }

  return { category: "route_scenario", code: scenario.textBlock, prompt, correct, decoys: decoys.slice(0, 3), explanation };
}

// ---------- Networking: iptables scenario engine ----------
function genIptablesScenario() {
  const policy = randChoice(["DROP", "ACCEPT"]);
  const services = shuffleArray([
    { name: "ssh", port: 22 }, { name: "http", port: 80 }, { name: "https", port: 443 }, { name: "telnet", port: 23 },
  ]).slice(0, randInt(2, 3));
  const rules = services.map(s => ({ target: "ACCEPT", proto: "tcp", port: s.port, name: s.name }));
  const hasDropRule = Math.random() < 0.5;
  const dropSourceIp = randomIp();
  if (hasDropRule) rules.push({ target: "DROP", proto: "all", source: dropSourceIp });

  const header = `Chain INPUT (policy ${policy})`;
  const colHeader = "target     prot opt source               destination";
  const ruleLines = rules.map(r => {
    if (r.target === "ACCEPT") return `ACCEPT     ${r.proto}  --  anywhere             anywhere             tcp dpt:${r.name}`;
    return `DROP       ${r.proto}  --  ${r.source}          anywhere`;
  });
  const textBlock = [header, colHeader, ...ruleLines].join("\n");
  return { policy, rules, textBlock, hasDropRule, dropSourceIp, acceptCount: rules.filter(r => r.target === "ACCEPT").length };
}

function genIptablesQuestion() {
  const scenario = genIptablesScenario();
  const qTypes = ["policy_effect", "accept_count", "port_lookup"];
  const qType = randChoice(qTypes);
  let prompt, correct, decoys, explanation;

  if (qType === "policy_effect") {
    prompt = "Based on this chain's policy, what happens to traffic that matches none of the explicit rules shown?";
    correct = scenario.policy === "DROP" ? "It is silently dropped" : "It is allowed through";
    decoys = scenario.policy === "DROP"
      ? ["It is allowed through", "It is logged but still passed through", "The system halts all networking"]
      : ["It is silently dropped", "It is logged but still passed through", "The system halts all networking"];
    explanation = `The chain's default policy is ${scenario.policy}, which governs anything that doesn't match one of the explicit rules above it.`;
  } else if (qType === "accept_count") {
    prompt = "How many rules in this chain have an ACCEPT target?";
    correct = String(scenario.acceptCount);
    const candidates = new Set([String(scenario.acceptCount + 1), String(Math.max(0, scenario.acceptCount - 1)), String(scenario.rules.length)]);
    candidates.delete(correct);
    decoys = [...candidates].slice(0, 3);
    while (decoys.length < 3) { const d = scenario.acceptCount + randInt(1, 3); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `Counting the rule lines ending in ACCEPT gives ${scenario.acceptCount}.`;
  } else {
    const acceptRule = randChoice(scenario.rules.filter(r => r.target === "ACCEPT"));
    prompt = `Based on this output, which port does the rule allowing ${acceptRule.name} traffic target?`;
    correct = String(acceptRule.port);
    const otherPorts = scenario.rules.filter(r => r.target === "ACCEPT" && r.port !== acceptRule.port).map(r => String(r.port));
    decoys = [...new Set(otherPorts)];
    while (decoys.length < 3) { const d = randChoice([21, 25, 53, 3389]); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `The ACCEPT rule for ${acceptRule.name} shows "dpt:${acceptRule.port}", the destination port it matches.`;
  }

  return { category: "iptables_scenario", code: scenario.textBlock, prompt, correct, decoys: decoys.slice(0, 3), explanation };
}


const NETWORKING_GENERATORS = [genSubnetHosts, genSubnetMask, genNetworkAddress];
const SCENARIO_GENERATORS = [genNetstatQuestion, genRouteQuestion, genIptablesQuestion];
const NETWORKING_CATEGORY_LABELS = {

  ethernet: "Ethernet", routing: "Routing", protocols: "Lower-level protocols", topology: "Network topology (LAN/WAN)",

};
let usedNetworkingPrompts = new Set(); // reset per session in startNetworkingPractice()
// BPF query-writing questions -- a genuinely different interaction than
// everything else in this app: free-text input instead of multiple choice.
// Kept as its own dedicated category (accessed via the topic picker), not
// mixed into the random rotation other networking questions use, since
// switching interaction modes mid-session without warning would be jarring.
const BPF_POOL = [
  ["bpf_query", "Write a BPF filter that captures only TCP traffic on port 80.", "tcp port 80", ["port 80 and tcp", "port 80 tcp", "tcp and port 80"], "The proto qualifier (tcp) combined with the port qualifier narrows the capture to just TCP segments using port 80 -- without 'tcp', this would also match UDP traffic on the same port number."],
  ["bpf_query", "Write a BPF filter that captures traffic only to or from host 192.168.1.1.", "host 192.168.1.1", [], "With no direction qualifier, BPF defaults to 'src or dst', so this matches traffic in either direction involving that address."],
  ["bpf_query", "Write a BPF filter that captures traffic only FROM host 10.0.0.5 (not traffic going to it).", "src host 10.0.0.5", ["src 10.0.0.5"], "The src qualifier restricts the match to traffic originating from that address -- without it, BPF would default to matching both directions."],
  ["bpf_query", "Write a BPF filter that captures TCP traffic on port 22, but only when host 10.0.0.5 is also involved (both conditions must be true).", "tcp and port 22 and host 10.0.0.5", ["tcp port 22 and host 10.0.0.5"], "The 'and' operator (equivalently &&) requires every joined condition to be true simultaneously -- this only matches SSH traffic that specifically involves 10.0.0.5, not all SSH traffic everywhere."],
  ["bpf_query", "Write a BPF filter that captures traffic on EITHER port 80 OR port 443.", "port 80 or port 443", ["port 443 or port 80"], "The 'or' operator (equivalently ||) matches if any joined condition is true -- this captures both plain HTTP and HTTPS traffic in one filter."],
  ["bpf_query", "Write a BPF filter that captures UDP traffic within the port range 7000 to 7009.", "udp portrange 7000-7009", [], "The portrange qualifier lets you match a contiguous block of ports in one primitive, rather than writing out each port individually joined by 'or'."],
  ["bpf_query", "Write a BPF filter that captures ARP traffic on network 128.3.", "arp net 128.3", [], "The proto qualifier (arp) combined with the net qualifier restricts the match to ARP traffic specifically associated with that network."],
  ["bpf_query", "Write a BPF filter that captures everything EXCEPT ICMP traffic.", "not icmp", ["!icmp"], "The negation operator (not, equivalently !) inverts the match -- this passes every packet that is not ICMP, rather than trying to enumerate every other protocol explicitly."]
]
;
function generateBPFRound() {
  const [category, prompt, correctAnswer, variants, explanation] = BPF_POOL[Math.floor(Math.random() * BPF_POOL.length)];
  return { category, prompt, inputType: "freetext", correctAnswer, acceptedAnswers: [correctAnswer, ...variants], explanation };
}

function generateNetworkingRound() {
  // Weighted: ~15% subnetting, ~20% scenario generators (netstat/route/iptables,
  // picked randomly among the three when this bracket is hit), ~65% pool. The
  // three scenario generators are grouped together since they're the same kind
  // of richer question format -- one realistic output, something to notice in it.
  const roll = Math.random();
  let orderedSources;
  if (roll < 0.15) orderedSources = [...shuffleArray(NETWORKING_GENERATORS), ...shuffleArray(SCENARIO_GENERATORS), genFromNetworkingPool];
  else if (roll < 0.35) orderedSources = [...shuffleArray(SCENARIO_GENERATORS), genFromNetworkingPool, ...shuffleArray(NETWORKING_GENERATORS)];
  else orderedSources = [genFromNetworkingPool, ...shuffleArray(SCENARIO_GENERATORS), ...shuffleArray(NETWORKING_GENERATORS)];

  for (const gen of orderedSources) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const r = gen();
      if (!usedNetworkingPrompts.has(r.prompt)) {
        usedNetworkingPrompts.add(r.prompt);
        return finalizeNetworkingRound(r);
      }
    }
  }
  // Only reached if the pool and all generators are independently exhausted
  // after real effort -- not achievable within a 15-question session given the
  // pool's 37 items plus the generators' value spaces, but a safe fallback exists.
  const r = genFromNetworkingPool();
  return finalizeNetworkingRound(r);
}
function finalizeNetworkingRound(r) {
  if (r.inputType === "freetext") {
    return { category: r.category, prompt: r.prompt, inputType: "freetext", correctAnswer: r.correctAnswer, acceptedAnswers: r.acceptedAnswers, explanation: r.explanation };
  }
  const options = shuffleArray([...r.decoys, r.correct]);
  const labels = ["A", "B", "C", "D"];
  const choicesMap = {}; labels.forEach((l, i) => choicesMap[l] = options[i]);
  const correctLetter = labels.find(l => choicesMap[l] === r.correct);
  return { category: r.category, code: r.code, prompt: r.prompt, choicesMap, correctLetter, correctAnswer: r.correct, explanation: r.explanation, diagramKey: r.diagramKey };
}

// Tries Claude's artifact storage first (works if viewed inside Claude), falls back
// to localStorage (works for a plain downloaded file opened in any browser, which
// is the primary expected use case for these tools).
async function storageGet(key) {
  if (HAS_CLAUDE_STORAGE) {
    try { const r = await window.storage.get(key, false); return r ? r.value : null; }
    catch (e) { /* key doesn't exist yet in Claude storage -- fall through */ }
  }
  if (HAS_LOCAL_STORAGE) { try { return localStorage.getItem(key); } catch (e) {} }
  return null;
}
async function storageSet(key, value) {
  if (HAS_CLAUDE_STORAGE) { try { await window.storage.set(key, value, false); } catch (e) {} }
  if (HAS_LOCAL_STORAGE) { try { localStorage.setItem(key, value); } catch (e) {} }
}

async function loadStrength() {
  if (!STORAGE_SUPPORTED) { statsLoaded = true; return; }
  try {
    // One-time migration: this key was previously named "cnt-strength" --
    // check the old name if the new one isn't found yet, so existing
    // progress carries over instead of silently resetting on this rename.
    let value = await storageGet("practice-strength");
    if (!value) { value = await storageGet("cnt-strength"); if (value) await storageSet("practice-strength", value); }

function saveEdit() {
