function genPsAuxScenario() {
  const numProcesses = randInt(4, 5);
  const chosen = shuffleArray(PS_PROCESSES).slice(0, numProcesses);
  let processes = chosen.map(p => ({
    user: p.user, pid: randInt(100, 9999),
    cpu: (Math.random() * 5).toFixed(1), mem: (Math.random() * 4).toFixed(1),
    stat: "S", command: p.command,
  }));
  const zombieIdx = randInt(0, processes.length - 1);
  processes[zombieIdx] = { ...processes[zombieIdx], stat: "Z", command: "[" + processes[zombieIdx].command.split("/").pop().split(" ")[0] + "] <defunct>", cpu: "0.0" };

  const header = "USER       PID  %CPU %MEM STAT COMMAND";
  const lines = processes.map(p => `${p.user.padEnd(10)} ${String(p.pid).padEnd(4)} ${p.cpu.padEnd(4)} ${p.mem.padEnd(4)} ${p.stat}    ${p.command}`);
  const textBlock = [header, ...lines].join("\n");
  return { processes, textBlock, zombie: processes[zombieIdx] };
}

function genPsAuxQuestion() {
  const scenario = genPsAuxScenario();
  const qType = randChoice(["find_zombie", "pid_lookup", "count_sleeping"]);
  let prompt, correct, decoys, explanation;

  if (qType === "find_zombie") {
    prompt = "Based on this output, which user is running the zombie process (STAT = Z)?";
    correct = scenario.zombie.user;
    const otherUsers = scenario.processes.filter(p => p.user !== correct).map(p => p.user);
    decoys = [...new Set(otherUsers)].slice(0, 3);
    while (decoys.length < 3) { const d = randChoice(PS_PROCESSES).user; if (d !== correct && !decoys.includes(d)) decoys.push(d); }
    explanation = `The line with STAT = Z (and "<defunct>" in the command) belongs to ${scenario.zombie.user}.`;
  } else if (qType === "pid_lookup") {
    const target = randChoice(scenario.processes);
    prompt = `Based on this output, what is the PID of the process owned by ${target.user}?`;
    correct = String(target.pid);
    const otherPids = scenario.processes.filter(p => p.pid !== target.pid).map(p => String(p.pid));
    decoys = [...new Set(otherPids)].slice(0, 3);
    while (decoys.length < 3) { const d = randInt(100, 9999); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `${target.user}'s line lists ${target.pid} in the PID column.`;
  } else {
    const sleepingCount = scenario.processes.filter(p => p.stat === "S").length;
    prompt = "How many processes in this output are in the sleeping state (STAT = S)?";
    correct = String(sleepingCount);
    const candidates = new Set([String(sleepingCount + 1), String(Math.max(0, sleepingCount - 1)), String(scenario.processes.length)]);
    candidates.delete(correct);
    decoys = [...candidates].slice(0, 3);
    while (decoys.length < 3) { const d = sleepingCount + randInt(1, 3); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `Counting the lines with STAT = S gives ${sleepingCount}.`;
  }

  return { category: "ps_aux_scenario", code: scenario.textBlock, prompt, correct, decoys: decoys.slice(0, 3), explanation };
}

// ---------- Security: nmap scan scenario engine ----------
const NMAP_SERVICES = [
  { port: 22, name: "ssh" }, { port: 80, name: "http" }, { port: 443, name: "https" },
  { port: 21, name: "ftp" }, { port: 3389, name: "ms-wbt-server" }, { port: 3306, name: "mysql" },
];

function genNmapScenario() {
  const targetIp = randomIp();
  const numPorts = randInt(3, 4);
  const chosen = shuffleArray(NMAP_SERVICES).slice(0, numPorts);
  const states = ["open", "open", "closed", "filtered"]; // weighted toward open, but varied
  let ports = chosen.map(s => ({ port: s.port, name: s.name, state: randChoice(states) }));
  // guarantee at least one open port, for question types that need one
  if (!ports.some(p => p.state === "open")) ports[0].state = "open";

  const header = "PORT     STATE    SERVICE";
  const lines = ports.map(p => `${(p.port + "/tcp").padEnd(9)}${p.state.padEnd(9)}${p.name}`);
  const textBlock = [`Starting Nmap scan on ${targetIp}`, header, ...lines].join("\n");
  return { ports, textBlock, targetIp, openCount: ports.filter(p => p.state === "open").length };
}

function genNmapQuestion() {
  const scenario = genNmapScenario();
  const qType = randChoice(["count_open", "service_lookup", "state_lookup"]);
  let prompt, correct, decoys, explanation;

  if (qType === "count_open") {
    prompt = "Based on this scan, how many ports are reported as open?";
    correct = String(scenario.openCount);
    const candidates = new Set([String(scenario.openCount + 1), String(Math.max(0, scenario.openCount - 1)), String(scenario.ports.length)]);
    candidates.delete(correct);
    decoys = [...candidates].slice(0, 3);
    while (decoys.length < 3) { const d = scenario.openCount + randInt(1, 3); if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `Counting the lines whose STATE column reads "open" gives ${scenario.openCount}.`;
  } else if (qType === "service_lookup") {
    const target = randChoice(scenario.ports);
    prompt = `Based on this scan, which port is running ${target.name}?`;
    correct = String(target.port);
    const otherPorts = scenario.ports.filter(p => p.port !== target.port).map(p => String(p.port));
    decoys = [...new Set(otherPorts)].slice(0, 3);
    while (decoys.length < 3) { const d = randChoice(NMAP_SERVICES).port; if (String(d) !== correct && !decoys.includes(String(d))) decoys.push(String(d)); }
    explanation = `The line for ${target.name} shows "${target.port}/tcp", so that's its port.`;
  } else {
    const target = randChoice(scenario.ports);
    prompt = `Based on this scan, what state is port ${target.port} (${target.name}) reported in?`;
    correct = target.state;
    // "unfiltered" is a genuine nmap port state (seen with ACK scans) that this
    // generator's scenarios never actually produce -- a legitimately plausible
    // fourth option for someone who knows nmap has more than three states.
    decoys = ["open", "closed", "filtered", "unfiltered"].filter(s => s !== correct).slice(0, 3);
    explanation = `The line for port ${target.port} (${target.name}) lists its STATE as ${target.state}.`;
  }

  return { category: "nmap_scenario", code: scenario.textBlock, prompt, correct, decoys: decoys.slice(0, 3), explanation };
}

let lastOSCategory = null;
let usedOSPrompts = new Set(); // reset per session in startOSPractice()
function generateOSRound() {
  // ~18% chance of the ps aux scenario (realistic generated output, several
  // things to notice), rest from the pool -- proportional to it being one
  // richer question format alongside many conceptual pool topics.
  if (Math.random() < 0.18) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const r = genPsAuxQuestion();
      if (!usedOSPrompts.has(r.prompt)) {
        usedOSPrompts.add(r.prompt);
        lastOSCategory = r.category;
        const options = shuffleArray([...r.decoys, r.correct]);
        const labels = ["A", "B", "C", "D"];
        const choicesMap = {}; labels.forEach((l, i) => choicesMap[l] = options[i]);
        const correctLetter = labels.find(l => choicesMap[l] === r.correct);
        return { category: r.category, code: r.code, prompt: r.prompt, choicesMap, correctLetter, correctAnswer: r.correct, explanation: r.explanation, diagramKey: r.diagramKey };
      }
    }
  }
  const preferred = OS_POOL.filter(item => item[0] !== lastOSCategory);
  const candidates = preferred.length ? preferred : OS_POOL;
  let attempts = 0;
  let chosen = null;
  while (attempts < 40) {
    attempts++;
    const pick = randChoice(candidates);
    if (!usedOSPrompts.has(pick[1])) { chosen = pick; break; }
  }
  if (!chosen) chosen = randChoice(OS_POOL); // safe fallback, not reachable within a 15-question session given 37 pool items
  const [category, prompt, correct, decoys, explanation] = chosen;
  lastOSCategory = category;
  usedOSPrompts.add(prompt);
  const options = shuffleArray([...decoys, correct]);
  const labels = ["A", "B", "C", "D"];
  const choicesMap = {}; labels.forEach((l, i) => choicesMap[l] = options[i]);
  const correctLetter = labels.find(l => choicesMap[l] === correct);
  return { category, code: null, prompt, choicesMap, correctLetter, correctAnswer: correct, explanation };
}

let usedFundamentalsPrompts = new Set(); // reset per session in startFundamentalsPractice()
function generateFundamentalsRound() {
  // Weighted: ~20% conversions, ~20% boolean logic, ~60% pool (5 topics) --
  // conversions and boolean logic are true procedural generation (effectively
  // unlimited), given real weight since they are genuinely valuable repeatable
  // skills, similar to how subnetting was weighted for Networking.
  const roll = Math.random();
  let orderedSources;
  if (roll < 0.2) orderedSources = [genConversionRound, genFromFundamentalsPool, genBooleanRound];
  else if (roll < 0.4) orderedSources = [genBooleanRound, genFromFundamentalsPool, genConversionRound];
  else orderedSources = [genFromFundamentalsPool, genConversionRound, genBooleanRound];

  for (const gen of orderedSources) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const r = gen();
      if (!usedFundamentalsPrompts.has(r.prompt)) {
        usedFundamentalsPrompts.add(r.prompt);
        return finalizeFundamentalsRound(r);
      }
    }
  }
  const r = genFromFundamentalsPool();
  return finalizeFundamentalsRound(r);
}

function startFundamentalsPractice() {
  usedFundamentalsPrompts = new Set();
  lastFundamentalsCategory = null;
  lastSimplify = null;
  lastBinarySimplify = null;
  const rounds = [];
  for (let i = 0; i < 15; i++) rounds.push(generateFundamentalsRound());
  state = { screen: "q", section: "fundamentals", rounds, i: 0, answered: false, sel: null, score: 0, categoryStats: {} };
  render();
}

}

const WEAK_PRACTICE_MAX_CATEGORIES = 12;

function getWeakestCategories(maxCount) {
  return Object.entries(categoryStats)
    .map(([cat, s]) => ({ category: cat, correct: s.correct, total: s.total, accuracy: s.total > 0 ? s.correct / s.total : 1 }))
    .filter(e => e.total > 0 && e.accuracy < 1)
    .sort((a, b) => a.accuracy - b.accuracy || b.total - a.total)
    .slice(0, maxCount);
}

function generateWeakPracticeRound() {

// Targeted practice on exactly one category, launched from the weak-spots list.
// Session length is capped to how many distinct questions actually exist for
// that category -- most pool categories have far fewer than 15 items (some as
// few as 2), and padding to 15 would just mean repeating the same few
// questions, which defeats the point and risks reinforcing memorization
// rather than understanding. Procedural categories (subnetting, code tracing,
// etc.) have no such ceiling, so those stay at the full 15.
function getCategoryPoolSize(category) {
  const allPools = [NETWORKING_POOL, OS_POOL, SECURITY_POOL, FUNDAMENTALS_POOL, INTERPOLATION_POOL, BPF_POOL];
  let count = 0;
  allPools.forEach(pool => pool.forEach(item => { if (item[0] === category) count++; }));
  return count; // 0 means the category is procedural (not in any static pool), i.e. unlimited
}
function startSingleCategoryPractice(category) {
  const gen = CATEGORY_TO_GENERATOR[category];
  if (!gen) return;
  const originSection = CATEGORY_TO_SECTION[category];
  const poolSize = getCategoryPoolSize(category);
  const sessionLength = poolSize > 0 ? Math.min(15, poolSize) : 15;
  const usedPrompts = new Set();
  const rounds = [];
  for (let i = 0; i < sessionLength; i++) {
    let r, attempts = 0;
    do { r = gen(); attempts++; } while (usedPrompts.has(r.prompt) && attempts < 40);
    usedPrompts.add(r.prompt);
    const finalized = finalizeNetworkingRound(r);
    finalized.originSection = originSection;
    rounds.push(finalized);
  }
  state = { screen: "q", section: "weak", rounds, i: 0, answered: false, sel: null, score: 0, categoryStats: {} };
  render();
}

// One-time initial survey: exactly one question per category (58 total,
// currently), shuffled so it doesn't march through in a predictable
// section-by-section order. Each answer still records into categoryStats
// through the normal pick() flow -- this function's only special job is
// building a session that touches every category exactly once.
function startSurveySession() {
  const allCategories = shuffleArray(Object.keys(CATEGORY_TO_GENERATOR));
  const rounds = allCategories.map(category => {
    const gen = CATEGORY_TO_GENERATOR[category];
    const r = gen();
    const finalized = finalizeNetworkingRound(r);
    finalized.originSection = CATEGORY_TO_SECTION[category];
    return finalized;
  });
  state = { screen: "q", section: "survey", rounds, i: 0, answered: false, sel: null, score: 0, categoryStats: {} };
  render();
}

// Builds a session from an arbitrary mix of selected topics, some with huge
// or unlimited pools and some with as few as 2 real questions. Round-robins
// across the selection (reshuffled every lap) so no single topic dominates,
// and naturally drops a topic out of rotation once it's genuinely exhausted
// rather than assuming every topic can supply an equal share up front.
const CUSTOM_SESSION_MIN = 10;
const CUSTOM_SESSION_MAX = 30;
function startCustomTopicPractice() {
  if (selectedTopics.size === 0) return;
  const targetLength = Math.min(CUSTOM_SESSION_MAX, Math.max(CUSTOM_SESSION_MIN, selectedTopics.size * 3));
  const topicsArray = [...selectedTopics];
  const usedPrompts = new Set();
  const exhausted = new Set();
  const rounds = [];
  let lapsWithNoProgress = 0;
  while (rounds.length < targetLength && exhausted.size < topicsArray.length && lapsWithNoProgress < 3) {
    const lapOrder = shuffleArray(topicsArray.filter(t => !exhausted.has(t)));
    let madeProgressThisLap = false;
    for (const topic of lapOrder) {
      if (rounds.length >= targetLength) break;
      const gen = CATEGORY_TO_GENERATOR[topic];
      let found = null;
      for (let attempt = 0; attempt < 15; attempt++) {
        const r = gen();
        const dedupKey = r.prompt + "|" + (r.code || "");
        if (!usedPrompts.has(dedupKey)) { found = r; found._dedupKey = dedupKey; break; }
      }
      if (found) {
        usedPrompts.add(found._dedupKey);
        const finalized = finalizeNetworkingRound(found);
        finalized.originSection = CATEGORY_TO_SECTION[topic];
        rounds.push(finalized);
        madeProgressThisLap = true;
      } else {
        exhausted.add(topic);
      }
    }
    lapsWithNoProgress = madeProgressThisLap ? 0 : lapsWithNoProgress + 1;
  }
  if (rounds.length === 0) return; // safety; not reachable given selection requires >=1 topic with a working generator
  state = { screen: "q", section: "custom", rounds, i: 0, answered: false, sel: null, score: 0, categoryStats: {} };
  render();
}

function pick(letter) {
  const round = state.rounds[state.i];
  if (round.answered) return;
  round.answered = true; round.sel = letter;
  state.answered = true; state.sel = letter;
  if (!state.categoryStats[round.category]) state.categoryStats[round.category] = { correct: 0, total: 0 };
  state.categoryStats[round.category].total += 1;
  const correct = letter === round.correctLetter;
  if (correct) { state.categoryStats[round.category].correct += 1; state.score += 1; }
  recordCategoryAttempt(round.category, correct);
  ensureAppAudioCtx();
  correct ? playCorrectSound() : playIncorrectSound();
  render();
}
// Normalizes free-text answers before comparison: trims, lowercases, and
// collapses repeated internal whitespace, so formatting differences like
// extra spaces don't cause an otherwise-correct answer to be marked wrong.
function normalizeBpfAnswer(s) { return (s || "").trim().toLowerCase().replace(/\s+/g, " "); }
function submitFreeTextAnswer() {
  const round = state.rounds[state.i];
  if (round.answered) return;
  const input = document.getElementById("bpf-input-field");
  const typed = input ? input.value : "";
  round.answered = true; round.sel = typed;
  state.answered = true; state.sel = typed;
  if (!state.categoryStats[round.category]) state.categoryStats[round.category] = { correct: 0, total: 0 };
  state.categoryStats[round.category].total += 1;
  const normalizedTyped = normalizeBpfAnswer(typed);
  const correct = round.acceptedAnswers.some(a => normalizeBpfAnswer(a) === normalizedTyped);
  if (correct) { state.categoryStats[round.category].correct += 1; state.score += 1; }
  recordCategoryAttempt(round.category, correct);
  ensureAppAudioCtx();
  correct ? playCorrectSound() : playIncorrectSound();
  render();
}
function goToPrevious() { if (state.i > 0) { state.i -= 1; render(); } }
function next() {
  if (state.i < state.rounds.length - 1) { state.i += 1; state.answered = false; state.sel = null; render(); }
  else {
    // Weak-practice sessions mix categories from multiple sections, so there's
    // no single section score to update -- categoryStats (updated per-answer in
    // pick()) is the source of truth for weak-practice targeting, not this.
    if (state.section !== "weak" && state.section !== "survey" && state.section !== "custom") {
      const scorePct = Math.round((state.score / state.rounds.length) * 100);
      const key = SECTION_META[state.section].key;
      sectionStrength[key] = scorePct;
      saveStrength();
    }
    state.screen = "report";
    render();
  }
}
function restart() { state = { screen: "dashboard", rounds: [], i: 0, answered: false, sel: null, score: 0, categoryStats: {} }; render(); }

// ---------- Pomodoro timer (fixed widget, persists across all screens) ----------
let pomodoroFocusMinutes = 25;
let pomodoroBreakMinutes = 5;
let pomodoroLongBreakMinutes = 15;
const POMODORO_CYCLES_UNTIL_LONG_BREAK = 4;
let pomodoroCompletedFocusSessions = 0;
let pomodoroSeconds = pomodoroFocusMinutes * 60;
let pomodoroRunning = false;
let pomodoroMode = "focus"; // "focus" | "break" | "longBreak"
let pomodoroIntervalId = null;
let pomodoroSettingsOpen = false;
let appAudioCtx = null;
let pomodoroFlashUntil = 0;

function formatPomodoroTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function pomodoroDurationForMode(mode) {
  if (mode === "focus") return pomodoroFocusMinutes * 60;
  if (mode === "longBreak") return pomodoroLongBreakMinutes * 60;
  return pomodoroBreakMinutes * 60;
}
async function loadPomodoroSettings() {
  if (!STORAGE_SUPPORTED) return;
  try {
    // Same one-time migration as loadStrength() -- old key was "cnt-pomodoro-settings".
    let value = await storageGet("practice-pomodoro-settings");
    if (!value) { value = await storageGet("cnt-pomodoro-settings"); if (value) await storageSet("practice-pomodoro-settings", value); }
    if (value) {
      const parsed = JSON.parse(value);
      if (parsed.focusMinutes > 0) pomodoroFocusMinutes = parsed.focusMinutes;
      if (parsed.breakMinutes > 0) pomodoroBreakMinutes = parsed.breakMinutes;
      if (parsed.longBreakMinutes > 0) pomodoroLongBreakMinutes = parsed.longBreakMinutes;
    }
  } catch (e) {}
  pomodoroSeconds = pomodoroFocusMinutes * 60;
}
async function savePomodoroSettings() {
  if (!STORAGE_SUPPORTED) return;
  try { await storageSet("practice-pomodoro-settings", JSON.stringify({ focusMinutes: pomodoroFocusMinutes, breakMinutes: pomodoroBreakMinutes, longBreakMinutes: pomodoroLongBreakMinutes })); } catch (e) {}
}

// Shared audio system for the whole app (not just the Pomodoro timer) --
// synthesized tones via the Web Audio API, no external audio files needed.
// The AudioContext is created/resumed synchronously inside a real user
// gesture's own click handler (see the global click listener below, and
// togglePomodoro), never inside a later async callback, since browsers
// generally require a genuine user gesture before allowing audio -- creating
// it late risks the browser silently blocking it.
let soundEnabled = true;
async function loadSoundSetting() {
  if (!STORAGE_SUPPORTED) return;
  try {
    const value = await storageGet("practice-sound-enabled");
    if (value !== null && value !== undefined) soundEnabled = value !== "false";
  } catch (e) {}
}
async function saveSoundSetting() {
  if (!STORAGE_SUPPORTED) return;
  try { await storageSet("practice-sound-enabled", String(soundEnabled)); } catch (e) {}
}
function toggleSound() {
  soundEnabled = !soundEnabled;
  saveSoundSetting();
  if (soundEnabled) { ensureAppAudioCtx(); playClickSound(); }
  render();
}
function ensureAppAudioCtx() {
  if (!appAudioCtx) {
    try { const AudioCtx = window.AudioContext || window.webkitAudioContext; if (AudioCtx) appAudioCtx = new AudioCtx(); } catch (e) {}
  } else if (appAudioCtx.state === "suspended") {
    try { appAudioCtx.resume(); } catch (e) {}
  }
}
// Envelope shape shared by every synthesized sound: quick exponential
// attack, exponential decay to silence -- avoids the clicks/pops a hard
// on/off would produce, regardless of which tone or duration is used.
function playTone(freq, startTime, duration, type, peakVolume) {
  const ctx = appAudioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.frequency.value = freq;
  osc.type = type || "sine";
  gain.gain.setValueAtTime(0.001, startTime);
  gain.gain.exponentialRampToValueAtTime(peakVolume, startTime + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration);
}
function playPomodoroDing() {
  if (!soundEnabled || !appAudioCtx) return;
  try {
    const now = appAudioCtx.currentTime;
    const beepDuration = 0.15;
    const gapBetweenBeeps = 0.12;
    for (let i = 0; i < 4; i++) playTone(880, now + i * (beepDuration + gapBetweenBeeps), beepDuration, "sine", 0.8);
  } catch (e) {}
}
// A short, sharp square-wave blip -- square waves read as more "mechanical
// keyboard" / retro-terminal than a smooth sine tone would, matching the
// CRT aesthetic rather than a modern soft UI click.
function playClickSound() {
  if (!soundEnabled || !appAudioCtx) return;
  try { playTone(1200, appAudioCtx.currentTime, 0.03, "square", 0.05); } catch (e) {}
}
function playCorrectSound() {
  if (!soundEnabled || !appAudioCtx) return;
  try {
    const now = appAudioCtx.currentTime;
    playTone(600, now, 0.09, "sine", 0.35);
    playTone(900, now + 0.08, 0.14, "sine", 0.35);
  } catch (e) {}
}
function playIncorrectSound() {
  if (!soundEnabled || !appAudioCtx) return;
  try { playTone(180, appAudioCtx.currentTime, 0.22, "sawtooth", 0.18); } catch (e) {}
}
// One delegated listener covers every button and role="button" element
// already in the app (choices, tiles, nav links, etc.) without needing a
// sound call threaded through each individual onclick handler by hand.
document.addEventListener("click", (e) => {
  if (e.target.closest('button, [role="button"]')) { ensureAppAudioCtx(); playClickSound(); }
}, true);

function renderPomodoro() {
  const widget = document.getElementById("pomodoro-widget");
  if (!widget) return;
  if (pomodoroSettingsOpen) {
    widget.innerHTML = `<div class="pomo-settings">
      <label class="pomo-settings-row">Focus <input type="number" min="1" max="90" value="${pomodoroFocusMinutes}" id="pomo-focus-input"> min</label>
      <label class="pomo-settings-row">Break <input type="number" min="1" max="30" value="${pomodoroBreakMinutes}" id="pomo-break-input"> min</label>
      <label class="pomo-settings-row">Long break <input type="number" min="1" max="60" value="${pomodoroLongBreakMinutes}" id="pomo-long-break-input"> min</label>
      <button class="pomo-btn" style="width:100%; margin-top:6px;" onclick="savePomodoroSettingsFromInputs()">Done</button>
    </div>`;
    return;
  }
  const modeLabels = { focus: "Focus", break: "Break", longBreak: "Long break" };
  const cyclePosition = (pomodoroCompletedFocusSessions % POMODORO_CYCLES_UNTIL_LONG_BREAK);
  const cycleDots = Array.from({ length: POMODORO_CYCLES_UNTIL_LONG_BREAK }, (_, i) =>
    i < cyclePosition || (pomodoroMode !== "focus" && i === cyclePosition) ? "&#9679;" : "&#9675;"
  ).join(" ");
  const flashing = Date.now() < pomodoroFlashUntil;
  widget.innerHTML = `<div class="pomo-top-row"><span class="pomo-mode ${pomodoroMode}${flashing ? " pomo-flash" : ""}">${modeLabels[pomodoroMode]}</span><span class="pomo-icon-row"><span class="pomo-sound-toggle${soundEnabled ? "" : " muted"}" onclick="toggleSound()" role="button" tabindex="0" aria-label="Toggle sound">${soundEnabled ? "[SND]" : "[MUTE]"}</span><span class="pomo-gear" onclick="togglePomodoroSettings()" role="button" tabindex="0" aria-label="Timer settings">&#9881;</span></span></div><div class="pomo-time${flashing ? " pomo-flash" : ""}">${formatPomodoroTime(pomodoroSeconds)}</div><div class="pomo-cycle-dots">${cycleDots}</div><div class="pomo-controls"><button class="pomo-btn" onclick="togglePomodoro()">${pomodoroRunning ? "Pause" : "Start"}</button><button class="pomo-btn" onclick="resetPomodoro()">Reset</button></div>`;
  if (flashing) setTimeout(renderPomodoro, Math.max(0, pomodoroFlashUntil - Date.now()) + 20);
}
function togglePomodoroSettings() {
  pomodoroSettingsOpen = !pomodoroSettingsOpen;
  if (pomodoroSettingsOpen && pomodoroRunning) { clearInterval(pomodoroIntervalId); pomodoroRunning = false; }
  renderPomodoro();
}
function savePomodoroSettingsFromInputs() {
  const focusVal = parseInt(document.getElementById("pomo-focus-input").value, 10);
  const breakVal = parseInt(document.getElementById("pomo-break-input").value, 10);
  const longBreakVal = parseInt(document.getElementById("pomo-long-break-input").value, 10);
  if (focusVal > 0) pomodoroFocusMinutes = Math.min(90, focusVal);
  if (breakVal > 0) pomodoroBreakMinutes = Math.min(30, breakVal);
  if (longBreakVal > 0) pomodoroLongBreakMinutes = Math.min(60, longBreakVal);
  savePomodoroSettings();
  pomodoroSettingsOpen = false;
  pomodoroMode = "focus";
  pomodoroCompletedFocusSessions = 0;
  pomodoroSeconds = pomodoroFocusMinutes * 60;
  renderPomodoro();
}
function togglePomodoro() {
  if (pomodoroRunning) {
    clearInterval(pomodoroIntervalId);
    pomodoroRunning = false;
  } else {
    ensureAppAudioCtx(); // primed here, synchronously inside this click handler
    pomodoroRunning = true;
    pomodoroIntervalId = setInterval(() => {
      pomodoroSeconds -= 1;
      if (pomodoroSeconds <= 0) {
        if (pomodoroMode === "focus") {
          pomodoroCompletedFocusSessions += 1;
          const longBreakDue = pomodoroCompletedFocusSessions % POMODORO_CYCLES_UNTIL_LONG_BREAK === 0;
          pomodoroMode = longBreakDue ? "longBreak" : "break";
        } else {
          pomodoroMode = "focus";
        }
        pomodoroSeconds = pomodoroDurationForMode(pomodoroMode);
        pomodoroRunning = false;
        clearInterval(pomodoroIntervalId);
        pomodoroFlashUntil = Date.now() + 3000;
        playPomodoroDing();
      }
      renderPomodoro();
    }, 1000);
  }
  renderPomodoro();
}
function resetPomodoro() {
  clearInterval(pomodoroIntervalId);
  pomodoroRunning = false;
  pomodoroMode = "focus";
  pomodoroCompletedFocusSessions = 0;
  pomodoroSeconds = pomodoroFocusMinutes * 60;
  renderPomodoro();
}

async function init() {
  try {
    await loadStrength();
    await loadCategoryStats();
    await loadPomodoroSettings();
    await loadSoundSetting();
    render();
  } catch (err) {
    const app = document.getElementById("app");
    if (app) {
      app.innerHTML = `<div class="card" style="text-align:center;">
        <div style="font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--incorrect); margin-bottom:12px;">Something went wrong loading the dashboard</div>
        <div style="font-size:12px; color:var(--ink-muted); text-align:left; background:var(--ink-black); padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word;">${esc(String(err && err.stack || err))}</div>
        <div style="font-size:12px; color:var(--ink-muted); margin-top:14px;">Screenshot this message -- it tells us exactly what failed.</div>
      </div>`;
    }
  }
}
window.addEventListener("error", (event) => {
  const app = document.getElementById("app");
  if (app && !app.innerHTML.trim()) {
    app.innerHTML = `<div class="card" style="text-align:center;">
      <div style="font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--incorrect); margin-bottom:12px;">Something went wrong loading the dashboard</div>
      <div style="font-size:12px; color:var(--ink-muted); text-align:left; background:var(--ink-black); padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word;">${esc(String(event.message) + " (line " + event.lineno + ")")}</div>
      <div style="font-size:12px; color:var(--ink-muted); margin-top:14px;">Screenshot this message -- it tells us exactly what failed.</div>
    </div>`;
  }
});
init();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("practice-service-worker.js").catch(() => {});
  });
}
</script>
